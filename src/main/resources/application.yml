spring:
  application:
    name: nexus-artifex-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/nexusartifex
    username: nexusartifex
    password: nexusartifex
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.nexusartifex: DEBUG
    org.hibernate.SQL: DEBUG

# Feature Flags
features:
  ai:
    enabled: true  # Controla se a engine de IA é chamada

# OpenAI Configuration
openai:
  api:
    key: ${OPENAI_API_KEY:}  # Lê da variável de ambiente
  model: gpt-4o-mini  # Modelo a usar (gpt-4o-mini é mais barato)
